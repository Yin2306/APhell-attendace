name: Manual Attendance

on:
  workflow_dispatch:
    inputs:
      otp:
        required: true
  repository_dispatch:
    types: [tg_bot_trigger]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache Playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install dependencies
        run: |
          pip install playwright pyyaml requests --no-cache-dir
          playwright install-deps chromium
          playwright install chromium

      - name: Run attendance script
        env:
          ACCOUNTS_YAML: ${{ secrets.ACCOUNTS_YAML }}
          OTP_CODE: ${{ github.event.inputs.otp || github.event.client_payload.otp }}
        run: python main.py

      - name: Send Report to Telegram
        if: always()
        env:
          # Core fix: explicitly define environment variables here so curl can access them
          TG_BOT_TOKEN: "8673109538:AAFgaGnTH3C_jmOFsgSIOYsiuGW5YibcXgc"
          TG_CHAT_ID: "-4908224282"
        run: |
          if [ -f result.txt ]; then
            REPORT=$(cat result.txt)
          else
            REPORT="❌ Script did not generate result.txt. Please check GitHub logs."
          fi

          # Use printf to safely handle special characters and prevent curl from breaking
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=📊 APU Attendance Detailed Report:

          $REPORT"
