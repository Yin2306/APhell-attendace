name: Manual Attendance
on:
  workflow_dispatch:
    inputs:
      otp:
        description: 'Enter the 3-digit OTP'
        required: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # 开启 pip 缓存，加速安装 requests 和 pyyaml

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Fast Install
        run: |
          pip install playwright pyyaml requests --no-cache-dir
          # 如果缓存命中了，就不再运行完整的 install，只安装必要的系统依赖
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run attendance script
        env:
          ACCOUNTS_YAML: ${{ secrets.ACCOUNTS_YAML }}
          OTP_CODE: ${{ github.event.inputs.otp }}
        run: python main.py
