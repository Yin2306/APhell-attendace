name: Manual Attendance
on:
  workflow_dispatch:
    inputs:
      otp:
        description: 'Enter the 3-digit OTP'
        required: true

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Cache Playwright
        id: cache-playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1
      - name: Install dependencies
        run: |
          pip install playwright pyyaml requests
          playwright install --with-deps chromium
      - name: Run attendance script
        env:
          ACCOUNTS_YAML: ${{ secrets.ACCOUNTS_YAML }}
          OTP_CODE: ${{ github.event.inputs.otp }}
        run: python main.py
