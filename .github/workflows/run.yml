name: Manual Attendance
on:
  workflow_dispatch:
    inputs:
      otp:
        required: true
  repository_dispatch:
    types: [tg_bot_trigger]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache Playwright
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install dependencies
        run: |
          pip install playwright pyyaml requests --no-cache-dir
          playwright install-deps chromium
          playwright install chromium

      - name: Run attendance script
        env:
          ACCOUNTS_YAML: ${{ secrets.ACCOUNTS_YAML }}
          OTP_CODE: ${{ github.event.inputs.otp || github.event.client_payload.otp }}
        run: python main.py

      - name: Send Report to Telegram
        if: always()
        env:
          # 核心修正：在这里显式定义环境变量，让下面的 curl 能读到
          TG_BOT_TOKEN: "8673109538:AAFgaGnTH3C_jmOFsgSIOYsiuGW5YibcXgc"
          TG_CHAT_ID: "-4908224282"
        run: |
          if [ -f result.txt ]; then
            REPORT=$(cat result.txt)
          else
            REPORT="❌ 脚本未生成 result.txt，请检查 GitHub 日志。"
          fi

          # 使用 printf 来处理可能存在的特殊字符，防止 curl 崩溃
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=📊 APU 签到详细汇报：

          $REPORT"
